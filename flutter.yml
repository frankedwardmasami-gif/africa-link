name: AFRICA LINK CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.29.0
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Generate Android/Web platform scaffolding
        run: flutter create --platforms=android,ios,web --org com.africalink .

      - name: Get dependencies
        run: flutter pub get

      - name: Static release audit
        run: python3 scripts/release_audit.py

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: africa-link-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
